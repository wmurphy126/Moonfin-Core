name: Build Remote Feedback Android Test

on:
  push:
    branches: [test/remote-feedback-20260928]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOONFIN_TEST_ID_SUFFIX: .remotefeedback0928
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - name: Configure a separate mobile test application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          source = path.read_text()
          old = '''        create("mobile") {
                      dimension = "device"
                      applicationId = baseAppId'''
          new = old.replace('applicationId = baseAppId', 'applicationId = baseAppId + testIdSuffix')
          if source.count(old) != 1:
              raise SystemExit('Mobile flavor changed; refusing an ambiguous packaging edit')
          source = source.replace(old, new, 1)
          source = source.replace('manifestPlaceholders["appName"] = baseAppName',
                                  'manifestPlaceholders["appName"] = "Moonfin Remote Fix"', 1)
          path.write_text(source)
          PY
      - name: Resolve dependencies and check remote controls
        run: |
          flutter pub get
          flutter test test/data/services/remote_volume_sender_test.dart test/ui/navigation/deferred_route_pop_test.dart test/tv_keyboard_back_test.dart test/playback/appletv_remote_navigation_test.dart test/data/services/remote_command_queue_test.dart test/data/services/remote_search_test.dart test/data/services/remote_search_transport_test.dart test/ui/widgets/remote_search_sheet_test.dart test/ui/widgets/remote_search_dialog_test.dart test/auth/session_remote_command_test.dart test/data/services/websocket_playstate_parser_test.dart
      - name: Check Apple TV keyboard channel behavior
        run: flutter test --dart-define=MOONFIN_TVOS=true test/tv_keyboard_back_test.dart
      - name: Build universal mobile release APK
        run: flutter build apk --release --flavor mobile --build-number=30000160 --dart-define=DISTRIBUTION_CHANNEL=apk
      - name: Verify and collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK=build/app/outputs/flutter-apk/app-mobile-release.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/aapt" dump badging "$APK" > artifacts/apk-info.txt
          grep -q "package: name='org.moonfin.androidtv.remotefeedback0928'" artifacts/apk-info.txt
          grep -q "application-label:'Moonfin Remote Fix'" artifacts/apk-info.txt
          grep -q "versionCode='30000160'" artifacts/apk-info.txt
          cp "$APK" artifacts/Moonfin-Remote-Feedback-Android.apk
          cd artifacts
          sha256sum Moonfin-Remote-Feedback-Android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moonfin-remote-feedback-android
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2

      - name: Run analyzer and tests
        run: |
          mkdir -p /tmp/test-results
          status=0
          packages="custom_tv_text_field_fork design rar_fork server_core server_emby server_jellyfin"

          flutter pub get
          for pkg in $packages; do
            (cd "packages/$pkg" && flutter pub get >/dev/null)
          done

          # Only error lines gate the job, the tree carries longstanding infos.
          dart analyze 2>&1 | grep -E " error - " >> /tmp/test-results/analyzer.txt || true
          for pkg in $packages; do
            (cd "packages/$pkg" && dart analyze 2>&1 || true) | grep -E " error - " >> /tmp/test-results/analyzer.txt || true
          done

          flutter test --reporter json > /tmp/test-results/app.jsonl || status=1
          for pkg in $packages; do
            (cd "packages/$pkg" && flutter test --reporter json > "/tmp/test-results/pkg-$pkg.jsonl") || status=1
          done

          echo "$status" > /tmp/test-results/run-status

      - name: Summarize results
        if: always()
        run: |
          python3 - <<'EOF'
          import glob
          import json
          import os

          passed = failed = 0
          failures = []
          for path in sorted(glob.glob('/tmp/test-results/*.jsonl')):
              suite = os.path.basename(path)[:-6]
              names = {}
              for line in open(path):
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  if event.get('type') == 'testStart':
                      names[event['test']['id']] = event['test'].get('name', '?')
                  elif event.get('type') == 'testDone' and not event.get('hidden'):
                      if event.get('result') == 'success':
                          passed += 1
                      else:
                          failed += 1
                          failures.append(f"{suite}: {names.get(event.get('testID'), '?')}")

          analyzer = []
          try:
              analyzer = [l.rstrip() for l in open('/tmp/test-results/analyzer.txt') if l.strip()]
          except FileNotFoundError:
              pass

          try:
              run_status = int(open('/tmp/test-results/run-status').read().strip())
          except (FileNotFoundError, ValueError):
              run_status = 1

          out = {
              'passed': passed,
              'failed': failed,
              'failures': failures[:50],
              'more_failures': max(0, len(failures) - 50),
              'analyzer_errors': len(analyzer),
              'analyzer_sample': analyzer[:10],
              'run_status': run_status,
          }
          with open('/tmp/test-results/test-results.json', 'w') as f:
              json.dump(out, f)
          print(json.dumps({k: v for k, v in out.items() if k not in ('failures', 'analyzer_sample')}))
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: /tmp/test-results/test-results.json

      - name: Gate on failures
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          import sys
          results = json.load(open('/tmp/test-results/test-results.json'))
          bad = results['failed'] or results['analyzer_errors'] or results['run_status']
          sys.exit(1 if bad else 0)
          EOF

